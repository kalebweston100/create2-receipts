[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

solc = "0.8.34"
evm_version = "cancun" # EIP-1153 transient storage (witness channel), EIP-6780 semantics
optimizer = true
optimizer_runs = 200

# A receipt type IS its exact creation-code bytes: any change to the compiled output
# moves every receipt address. Dropping the CBOR metadata trailer keeps the bytes
# reproducible across machines (no absolute paths or settings hash baked in).
bytecode_hash = "none"
cbor_metadata = false

remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000
